<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Usuário</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ecf4ef; font-family: Arial, sans-serif; color: #193a2c; }
    main { width: min(420px, 92vw); padding: 32px; border-radius: 18px; box-shadow: 0 8px 25px #18392b20; background: white; }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { margin: 0 0 22px; color: #57685f; }
    label { display: block; margin: 15px 0 6px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #a9b7ad; border-radius: 8px; font-size: 16px; }
    input:focus { outline: 2px solid #6f8f5f; outline-offset: 1px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #244d35; color: white; font-size: 16px; cursor: pointer; }
    button:hover { background: #18392b; }
    #mensagem { margin: 18px 0 0; font-weight: bold; }
    .erro { color: #a11e29; }
    .sucesso { color: #18683d; }
  </style>
</head>
<body>
  <main>
    <h1>Cadastro de usuário</h1>
    <p>Preencha os dados para se cadastrar.</p>
    <form id="form-cadastro" novalidate>
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password">
      <button type="submit">Cadastrar</button>
    </form>
    <div id="mensagem" role="status" aria-live="polite"></div>
  </main>
  <script>
    const form = document.querySelector('#form-cadastro');
    const mensagem = document.querySelector('#mensagem');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const nome = form.elements.nome.value.trim();
      const email = form.elements.email.value.trim();
      const senha = form.elements.senha.value;
      mensagem.className = 'erro';
      if (!nome || !email || !senha) {
        mensagem.textContent = 'Preencha todos os campos.';
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mensagem.textContent = 'E-mail inválido.';
        return;
      }
      if (senha.length < 6) {
        mensagem.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        return;
      }
      // Demonstração escolar: dados armazenados somente nesta sessão do navegador.
      // Não é um sistema de cadastro real, nem envia senhas a um servidor.
      sessionStorage.setItem('usuarioDemo', JSON.stringify({ nome, email }));
      mensagem.className = 'sucesso';
      mensagem.textContent = 'Cadastro realizado com sucesso!';
    });
  </script>
</body>
</html>
