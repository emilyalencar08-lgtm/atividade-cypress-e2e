name: Testes E2E com Cypress

on:
  push:
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar servidor
        run: |
          npm start > servidor.log 2>&1 &
          echo $! > servidor.pid

      - name: Verificar servidor
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:3000/cadastro; then
              echo "Servidor funcionando!"
              exit 0
            fi
            sleep 2
          done
          cat servidor.log
          exit 1

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome